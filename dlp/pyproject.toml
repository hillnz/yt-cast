[project]
name = "dlp-archive"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "pydantic-settings>=2.0",
    "yt-dlp>=2024.0",
    "yt-dlp-ejs>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
