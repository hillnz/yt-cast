name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-dlp:
    name: Lint (dlp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: dlp/uv.lock

      - name: Install dependencies
        working-directory: dlp
        run: uv sync --frozen

      - name: Ruff lint
        working-directory: dlp
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: dlp
        run: uv run ruff format --check .

  test-dlp:
    name: Test (dlp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: dlp/uv.lock

      - name: Install dependencies
        working-directory: dlp
        run: uv sync --frozen

      - name: Pytest
        working-directory: dlp
        run: uv run pytest tests/ -v

  test-dlp-worker:
    name: Test (dlp-worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: dlp-worker/uv.lock

      - name: Install dependencies
        working-directory: dlp-worker
        run: uv sync --frozen

      - name: Pytest
        working-directory: dlp-worker
        run: uv run pytest tests/ -v

  docker-build:
    name: Docker build (dlp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./dlp
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: GIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
